<style>
  :root{
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  :root{
    --font-heading: 'Tajawal', sans-serif;
    --font-body: 'Tajawal', sans-serif;
    --title-size: 1.55rem;
    --title-weight: 800;
    --title-lh: 1.35;
    --desc-lh: 1.8;
    --text-align: inherit;
  }
  body{
    font-family: var(--font-body);
    min-height:100vh;
    color: var(--ink);
    background: var(--bg-image, var(--bg));
    position:relative;
    transition: background .3s ease, color .3s ease;
  }
  body.lux-glow::before{
    content:"";
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(circle at 15% -10%, var(--accent) 0%, transparent 45%),
      radial-gradient(circle at 105% 105%, var(--secondary, var(--accent)) 0%, transparent 42%);
    opacity:.12;

  body[data-theme="2"]{ --bg:#121417; --ink:#F2F2F0; --accent:#5B8CFF; --secondary:#8E6BFF; --accent-ink:#0A0A0A; --card:#1B1E22; --muted:#8E949C; --line:#2A2E33; }
  body[data-theme="3"]{ --bg:#FBEAE7; --ink:#2B1C24; --accent:#7A2F63; --secondary:#C97B8E; --accent-ink:#ffffff; --card:#FFFFFF; --muted:#9C7E8D; --line:#F1D3CD; }
  body[data-theme="4"]{ --bg:#F4E9D8; --ink:#1F2E27; --accent:#1F5C4A; --secondary:#B79A5C; --accent-ink:#ffffff; --card:#FFFCF6; --muted:#7C8A80; --line:#E3D3B4; }
  body[data-theme="5"]{ --bg:#FFFFFF; --ink:#15181B; --accent:#E4572E; --secondary:#E48A2E; --accent-ink:#ffffff; --card:#F7F7F8; --muted:#767C82; --line:#E9EAEC; }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  img{max-width:100%; display:block;}

  .wrap{max-width:520px; margin:0 auto; padding:0 18px 60px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; max-width:520px; margin:0 auto;

  .brand{font-weight:800; font-size:1.15rem; letter-spacing:.2px; font-family:var(--font-heading);}
  .lang-switch{
    display:flex; background:var(--card); border:1px solid var(--line); border-radius:999px; overflow:hidden;
  }
  .lang-switch button{
    padding:7px 14px; font-size:.82rem; font-weight:700; background:transparent; color:var(--muted);
  }
  .lang-switch button.active{ background:var(--accent); color:var(--accent-ink); }

  .hero-media{
    border-radius: var(--radius); overflow:hidden; background:var(--card); border:1px solid var(--line); margin-bottom:22px;
  }
  .hero-media video, .hero-media img{ width:100%; display:block; }
  .video-wrap{ position:relative; width:100%; }
  .video-wrap .product-video{ width:100%; display:block; }
  .video-sound-btn{
    position:absolute; bottom:12px; left:12px; z-index:2;
    width:42px; height:42px; border-radius:50%;
    background:rgba(0,0,0,.58); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; backdrop-filter:blur(4px);

  .thumbs{display:flex; gap:8px; margin-top:8px; overflow-x:auto;}

  .desc{ font-family:var(--font-body); color:var(--muted); font-size:.98rem; line-height:var(--desc-lh); text-align:var(--text-align); margin-bottom:18px; white-space:pre-line; }

  .price-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:22px; }
  .price{ font-family:var(--font-heading); font-size:1.7rem; font-weight:800; color:var(--accent); }
  .old-price{ font-size:1.05rem; color:var(--muted); text-decoration:line-through; }

  .cta{

    font-family:var(--font-body); font-size:1.02rem; font-weight:800; margin-bottom:14px;
    transition: transform .12s ease, filter .12s ease;
  }
  .cta:active{ transform:scale(.97); filter:brightness(.94); }
  .cta.secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .wa-btn{ display:flex; align-items:center; justify-content:center; gap:8px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.86rem; font-weight:700; margin-bottom:6px; color:var(--muted); }
  .field input, .field textarea, .field select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--bg); color:var(--ink); font-family:inherit; font-size:.95rem;

  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }

  .upsell-box .up-title{ font-weight:800; margin-bottom:6px; }
  .up-check{ display:flex; align-items:center; gap:10px; margin-top:10px; padding:12px; background:var(--bg); border-radius:10px; }

  .success{ text-align:center; padding:40px 10px; }
  .success .emoji{ font-size:3rem; margin-bottom:14px; }
  .success h2{ font-size:1.3rem; margin-bottom:8px; }
  .success p{ color:var(--muted); }

  .footer-note{ text-align:center; color:var(--muted); font-size:.78rem; margin-top:30px; }

  .admin-login{ max-width:360px; margin:60px auto; }
  .admin-tabs{ display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:18px; padding-bottom:4px; scrollbar-width:thin; }

  .theme-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:16px; }
  .theme-swatch{ height:46px; border-radius:10px; border:2px solid transparent; cursor:pointer; }

  .order-item{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }

  .order-item .meta{ color:var(--muted); font-size:.85rem; line-height:1.7; }
  .status-pill{ display:inline-block; padding:4px 12px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .badge-new{ background:#FFF1D6; color:#8A5B00; }
  .badge-confirmed{ background:#DCF5E3; color:#1F7A3D; }
  .badge-cancelled{ background:#FBDCDC; color:#B02A2A; }
  .toggle{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .toggle input{ width:20px; height:20px; }
  .small-muted{ color:var(--muted); font-size:.8rem; margin-top:-6px; margin-bottom:14px; }
  .logout-btn{ font-size:.82rem; color:var(--muted); text-decoration:underline; }
  .msg{ padding:10px 14px; border-radius:10px; font-size:.85rem; margin-bottom:14px; }
  .msg.ok{ background:#DCF5E3; color:#1F7A3D; }
  .msg.err{ background:#FBDCDC; color:#B02A2A; }

  /* ===== NEW: quantity stepper ===== */

  .qty-stepper button{
    background:var(--btn-color, var(--accent)); color:var(--accent-ink); font-size:1.3rem; font-weight:800;
    width:46px; height:100%; display:flex; align-items:center; justify-content:center;
    transition: transform .1s ease, filter .1s ease; flex-shrink:0;
  }
  .qty-stepper button:active{ transform:scale(.92); filter:brightness(.92); }
  .qty-stepper span{ flex:1; text-align:center; font-weight:800; font-size:1.05rem; font-family:var(--font-heading); color:var(--ink); }

  /* ===== NEW: admin nav links (preview / view site / logout) ===== */
  .admin-nav-links{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .admin-nav-links button, .admin-nav-links a{ font-size:.82rem; color:var(--muted); text-decoration:underline; background:none; padding:0; }

  /* ===== NEW: preview overlay ===== */
  .video-section{margin:18px 0}.section-mini-title{font-weight:900;margin-bottom:10px}.cart-bar{display:flex;justify-content:flex-end;margin:10px 0 14px}.cart-button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:999px;font-weight:800}.cart-button b{min-width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:.75rem}.purchase-selector{margin:18px 0}.purchase-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.purchase-option{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:800;cursor:pointer}.purchase-option.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent)}.purchase-option input{accent-color:var(--accent)}
.preview-overlay{ position:fixed; inset:0; background:var(--bg); z-index:2000; overflow-y:auto; }
  .preview-bar{ position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:12px 18px; background:var(--card); border-bottom:1px solid var(--line); }
  .preview-bar .tag{ font-size:.78rem; font-weight:800; color:var(--accent); }
  .preview-bar button{ padding:9px 16px; border-radius:999px; background:var(--ink); color:var(--bg); font-weight:700; font-size:.82rem; }

  /* ===== NEW: admin return floating button (on public site, admin only) ===== */
  .admin-return-btn{ position:fixed; bottom:16px; left:16px; z-index:999; padding:10px 16px; border-radius:999px;
    background:var(--ink); color:var(--bg); font-weight:700; font-size:.82rem; box-shadow:0 4px 14px rgba(0,0,0,.25); }

  /* ===== NEW: media uploads (images / video) ===== */
  .upload-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .upload-btn{ padding:10px 16px; border-radius:10px; background:var(--card); border:1.5px dashed var(--accent); color:var(--ink); font-weight:700; font-size:.85rem; }
  .img-thumb{ position:relative; width:70px; height:70px; border-radius:10px; overflow:hidden; border:1px solid var(--line); flex-shrink:0; }
  .img-thumb img{ width:100%; height:100%; object-fit:cover; }
  .img-thumb .rm-btn{ position:absolute; top:2px; left:2px; background:rgba(0,0,0,.6); color:#fff; border-radius:50%; width:20px; height:20px; font-size:.7rem; display:flex; align-items:center; justify-content:center; }
  .img-thumb .mv-btns{ position:absolute; bottom:2px; right:2px; display:flex; gap:2px; }
  .img-thumb .mv-btns button{ background:rgba(0,0,0,.6); color:#fff; border-radius:4px; width:16px; height:16px; font-size:.6rem; }
  .upload-status{ font-size:.8rem; color:var(--muted); margin-top:4px; min-height:1em; }
  .pack-admin-box{border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:22px;background:var(--card)}
  .pack-admin-title{font-size:1rem;font-weight:900;margin-bottom:6px}
  .pack-gallery-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .pack-public{margin:18px 0;padding:16px;border:1.5px solid var(--accent);border-radius:14px;background:var(--card)}

  .choice-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.choice-btn{padding:8px 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-weight:700}.choice-btn.selected{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .pack-piece-choice{border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:9px;background:var(--bg)}

  .pack-gallery{position:relative;overflow:hidden;border-radius:12px;background:var(--bg);touch-action:pan-y}
  .pack-gallery img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
  .pack-gallery-btn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
  .pack-gallery-prev{left:10px}.pack-gallery-next{right:10px}
  .pack-gallery-dots{text-align:center;padding:7px 0 0;font-size:.72rem;color:var(--muted)}
  .pack-choice{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .pack-choice input{width:19px;height:19px}


  /* ===== NEW: auto-contrast demo swatch ===== */
  .contrast-demo{ padding:12px 14px; border-radius:10px; margin-top:8px; margin-bottom:14px; font-size:.85rem; font-weight:700; text-align:center; border:1px solid var(--line); }

  /* ===== NEW: Design / Typography tab ===== */
  .font-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .font-card{ border:1.5px solid var(--line); border-radius:12px; padding:12px 10px; cursor:pointer; background:var(--card); text-align:center; }
  .font-card.selected{ border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent) inset; }
  .font-card .fc-sample{ font-size:1.15rem; font-weight:700; margin-bottom:4px; }
  .font-card .fc-name{ font-size:.75rem; color:var(--muted); font-weight:700; }
  .color-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .color-field{ }
  .color-field label{ display:block; font-size:.8rem; font-weight:700; margin-bottom:6px; color:var(--muted); }
  .color-field input[type=color]{ width:100%; height:42px; padding:2px; border-radius:8px; border:1.5px solid var(--line); background:var(--bg); }
  .seg-select{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .seg-select button{ padding:8px 14px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); font-size:.82rem; font-weight:700; color:var(--muted); }
  .seg-select button.selected{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .schema-note{ font-size:.78rem; color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:10px 12px; margin-bottom:14px; line-height:1.7; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:3000; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-box{ background:var(--card); color:var(--ink); border-radius:16px; padding:22px; max-width:380px; width:100%; max-height:88vh; overflow-y:auto; }
  .modal-box .close-x{ float:left; background:none; color:var(--muted); font-size:1.1rem; }
</style>

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxaHdoZWV0aGloa3B2b2dweHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjY0NTcsImV4cCI6MjEwMzcwMjQ1N30.jJbdAq535j252I_wGTkJuGbSUjkdUtMSQQsrhD4zo9o";

const SESSION_KEY = "store_admin_session";
let session = { access_token: null, refresh_token: null, expires_at: null, user: null };

function saveSession(s){
  session = s;
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){}
}
function loadStoredSession(){

}
function clearSession(){

async function refreshSession(refresh_token){
  if(!refresh_token) return null;

  });
  if(!r.ok) return null;

/* ============ SUPABASE REST HELPERS ============ */
function headers(auth){
  const h = { "apikey": SUPABASE_ANON_KEY, "Content-Type":"application/json" };
  h["Authorization"] = "Bearer " + (auth ? session.access_token : SUPABASE_ANON_KEY);
  return h;
}
async function sbGet(table, query){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers: headers(false) });
  return r.json();
}
async function sbGetAuth(table, query){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers: headers(true) });
  return r.json();
}
async function sbInsert(table, body, auth=false){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method:"POST", headers: {...headers(auth), "Prefer":"return=representation"}, body: JSON.stringify(body)
  });
  let data = null;
  try{ data = await r.json(); }catch(e){}
  return { ok: r.ok, status: r.status, data };
}

/* Public order insert: do NOT request the inserted row back.
   This avoids depending on a SELECT policy on orders when the customer is anonymous. */
async function sbInsertPublicOrder(body){
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
      method:"POST",
      headers:{ ...headers(false), "Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
    let data = null;
    try{ data = await r.json(); }catch(e){}
    return { ok:r.ok, status:r.status, data };
  }catch(e){
    return { ok:false, status:0, data:null, error:e };
  }
}
async function sbUpdate(table, query, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
    method:"PATCH", headers: {...headers(true), "Prefer":"return=representation"}, body: JSON.stringify(body)
  });

const MAX_IMAGE_MB = 8;

async function sbUploadFile(file, folder){
  try{
    const cleanName = file.name.replace(/[^a-zA-Z0-9.\-_]/g,"_");
    const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${cleanName}`;
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${path}`, {
      method:"POST",
      headers:{
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + session.access_token,
        "Content-Type": file.type || "application/octet-stream"
      },
      body: file
    });
    let data = null;
    try{ data = await r.json(); }catch(e){}
    const ok = r.ok && r.status>=200 && r.status<300;
    if(!ok){
      const errMsg = (data && (data.message || data.error)) || `status ${r.status}`;
      return { ok:false, url:null, error: errMsg };
    }
    const url = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${path}`;
    return { ok:true, url };
  } catch(networkErr){
    return { ok:false, url:null, error:"مشكل فالاتصال، عاود المحاولة" };
  }
}

function shadeColor(hex, percent){
  const h = (hex||"#888888").replace("#","");
  const full = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  let r = parseInt(full.substr(0,2),16); let g = parseInt(full.substr(2,2),16); let b = parseInt(full.substr(4,2),16);
  if(isNaN(r)||isNaN(g)||isNaN(b)){ r=g=b=136; }
  const t = percent<0 ? 0 : 255;
  const p = Math.abs(percent);
  r = Math.round((t-r)*p)+r; g = Math.round((t-g)*p)+g; b = Math.round((t-b)*p)+b;
  const toHex = v => v.toString(16).padStart(2,"0");
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}

/* ============ NEW: AUTO CONTRAST ============ */
function getReadableTextColor(hexBg){
  const hex = (hexBg||"#ffffff").replace("#","");
  const full = hex.length===3 ? hex.split("").map(c=>c+c).join("") : hex;
  const r = parseInt(full.substr(0,2),16); const rr = isNaN(r)?255:r;
  const g = parseInt(full.substr(2,2),16); const gg = isNaN(g)?255:g;
  const b = parseInt(full.substr(4,2),16); const bb = isNaN(b)?255:b;
  const toLin = c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); };
  const L = 0.2126*toLin(rr)+0.7152*toLin(gg)+0.0722*toLin(bb);
  return L > 0.5 ? "#1A1A1A" : "#FAFAFA";
}
function getMutedColor(hexBg){
  return getReadableTextColor(hexBg) === "#1A1A1A" ? "#6B6B6B" : "#B7BBC0";
}
const THEME_DEFAULT_BG = {1:"#F6F1E9",2:"#121417",3:"#FBEAE7",4:"#F4E9D8",5:"#FFFFFF"};
function applyThemeAndContrast(settings){
  settings = settings || {};
  const themeId = settings.theme_id || 1;
  document.body.setAttribute("data-theme", themeId);
  const bg = settings.bg_color || THEME_DEFAULT_BG[themeId] || "#FFFFFF";
  const ink = getReadableTextColor(bg);
  document.body.style.setProperty("--bg", bg);
  document.body.style.setProperty("--ink", ink);
  document.body.style.setProperty("--muted", getMutedColor(bg));

  /* custom luxury color overrides (fallback to theme defaults when empty) */
  if(settings.primary_color) document.body.style.setProperty("--accent", settings.primary_color);
  else document.body.style.removeProperty("--accent");
  if(settings.secondary_color) document.body.style.setProperty("--secondary", settings.secondary_color);
  else document.body.style.removeProperty("--secondary");
  if(settings.button_color) document.body.style.setProperty("--btn-color", settings.button_color);
  else document.body.style.removeProperty("--btn-color");
  if(settings.border_color) document.body.style.setProperty("--line", settings.border_color);
  else document.body.style.removeProperty("--line");

  /* luxury gradient background + soft glow */
  const useGradient = settings.bg_style !== "flat";
  if(useGradient){
    const light = shadeColor(bg, 0.06);
    const dark = shadeColor(bg, -0.05);
    document.body.style.setProperty("--bg-image", `linear-gradient(160deg, ${light} 0%, ${bg} 45%, ${dark} 100%)`);
    document.body.classList.add("lux-glow");
  } else {
    document.body.style.removeProperty("--bg-image");
    document.body.classList.remove("lux-glow");
  }

  /* typography */
  const style = FONT_STYLES[settings.font_style] || null;
  document.body.style.setProperty("--font-heading", style ? style.heading : "'Tajawal',sans-serif");
  document.body.style.setProperty("--font-body", style ? style.body : "'Tajawal',sans-serif");
  document.body.style.setProperty("--title-size", TITLE_SIZES[settings.title_size] || TITLE_SIZES.medium);
  document.body.style.setProperty("--title-weight", FONT_WEIGHTS[settings.font_weight] || FONT_WEIGHTS.bold);
  document.body.style.setProperty("--desc-lh", LINE_HEIGHTS[settings.line_height] || LINE_HEIGHTS.comfortable);
  document.body.style.setProperty("--title-lh", "1.3");
  document.body.style.setProperty("--text-align", TEXT_ALIGNS[settings.text_align] || TEXT_ALIGNS.auto);
}

function resetAdminChrome(){
  document.body.setAttribute("data-theme","5");
  document.body.classList.remove("lux-glow");
  ["--bg","--ink","--muted","--bg-image","--accent","--secondary","--btn-color","--line",
   "--font-heading","--font-body","--title-size","--title-weight","--title-lh","--desc-lh","--text-align"]
   .forEach(p=>document.body.style.removeProperty(p));
}

function initProductVideo(root=document){
  const video = root.querySelector(".product-video");
  const soundBtn = root.querySelector(".video-sound-btn");
  if(!video) return;

  video.muted = false;
  video.volume = 1;

  const tryPlay = async ()=>{
    try{
      await video.play();
      if(soundBtn) soundBtn.textContent = video.muted ? "🔇" : "🔊";
    }catch(e){
      // Browsers may block autoplay with sound. Fall back to muted autoplay,
      // while keeping the custom sound button available.
      video.muted = true;
      try{ await video.play(); }catch(_){}
      if(soundBtn) soundBtn.textContent = "🔇";
    }
  };

  tryPlay();

  if(soundBtn){
    soundBtn.onclick = async ()=>{
      video.muted = !video.muted;
      if(!video.paused){
        try{ await video.play(); }catch(_){}
      } else {
        try{ await video.play(); }catch(_){}
      }
      soundBtn.textContent = video.muted ? "🔇" : "🔊";
    };
  }

  video.addEventListener("contextmenu", e=>e.preventDefault());
  video.setAttribute("controlsList","nodownload noplaybackrate");
  video.setAttribute("disablePictureInPicture","");
}

function translateAdminDom(root=document.getElementById("app")){
  if(!root) return;
  const dict=ADMIN_I18N[ADMIN_LANG]||ADMIN_I18N.ar;
  // Build reverse maps so switching Arabic <-> Français is always reversible.
  const otherLang = ADMIN_LANG === "fr" ? "ar" : "fr";
  const reverse = {};
  const otherDict = ADMIN_I18N[otherLang] || {};
  Object.keys(otherDict).forEach(k=>{
    const v = otherDict[k];
    if(v && v !== k && reverse[v] == null) reverse[v] = k;
  });

  // Translate only UI/static elements. Do not touch user-entered product/order content.
  const selectors = [
    "h1","h2","h3","h4","label","button","a","option",
    ".small-muted",".pack-admin-title",".pack-public-badge",
    ".msg",".admin-tabs button",".admin-nav-links button",
    ".admin-nav-links a"
  ].join(",");

  root.querySelectorAll(selectors).forEach(el=>{
    // Keep the admin-language selector's selected value functional.
    if(el.id === "admin-lang-select") return;
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      const trimmed=n.nodeValue.trim();
      if(!trimmed) return;
      const translated = dict[trimmed] ?? reverse[trimmed];
      if(translated == null || translated === trimmed) return;
      n.nodeValue=n.nodeValue.replace(trimmed,translated);
    });
  });

  // Translate selected attributes when they are part of the admin UI.
  root.querySelectorAll("[aria-label]").forEach(el=>{
    const v=el.getAttribute("aria-label");
    if(dict[v]) el.setAttribute("aria-label",dict[v]);
  });
  root.querySelectorAll("[title]").forEach(el=>{
    const v=el.getAttribute("title");
    if(dict[v]) el.setAttribute("title",dict[v]);
  });
}

let ADMIN_LANG_OBSERVER = null;
function watchAdminTranslations(){
  const app=document.getElementById("app");
  if(!app) return;
  if(ADMIN_LANG_OBSERVER) ADMIN_LANG_OBSERVER.disconnect();
  ADMIN_LANG_OBSERVER=new MutationObserver(()=>translateAdminDom(app));
  ADMIN_LANG_OBSERVER.observe(app,{childList:true,subtree:true});
  translateAdminDom(app);
}

/* Prevent overlapping boot calls when navigation/hash changes quickly. */
let BOOT_SEQ = 0;

/* ============ ROUTER ============ */
function parseHashParams(hash){
  const h = (hash||"").startsWith("#") ? hash.slice(1) : (hash||"");
  return new URLSearchParams(h);
}

async function boot(){
  const seq = ++BOOT_SEQ;
  const hp = parseHashParams(location.hash);
  if(hp.get("type")==="recovery" && hp.get("access_token")){
    renderResetPassword(hp.get("access_token"));
    return;
  }

  const hash = location.hash;
  try {
    if(hash.startsWith("#admin")){
      SHOW_ADMIN_RETURN = false;
      await initAdminSession(seq);
    } else if(hash === "#view"){
      SHOW_ADMIN_RETURN = true;
      STATE.step = "form";
      await loadPublicData();
      if(seq !== BOOT_SEQ || location.hash !== hash) return;
      renderLanding();
    } else {
      SHOW_ADMIN_RETURN = false;
      STATE.step = "form";
      await loadPublicData();
      if(seq !== BOOT_SEQ || location.hash !== hash) return;
      renderLanding();
    }
  } catch(e) {
    console.error("Boot failed:", e);
    if(seq === BOOT_SEQ && hash.startsWith("#admin")){
      renderAdminLogin();
    }
  }
}

async function initAdminSession(seq){
  const stored = loadStoredSession();
  if(!stored || !stored.access_token){
    if(seq === BOOT_SEQ) renderAdminLogin();
    return;
  }

  if(stored.expires_at && stored.expires_at - Date.now() >= 60000){
    session = stored;
    if(seq === BOOT_SEQ) await renderAdminDashboard("product");
    return;
  }

  try {
    const refreshed = await refreshSession(stored.refresh_token);
    if(seq !== BOOT_SEQ) return;
    if(refreshed && refreshed.access_token){
      saveSession({
        access_token: refreshed.access_token,
        refresh_token: refreshed.refresh_token || stored.refresh_token,
        expires_at: Date.now() + (refreshed.expires_in||3600)*1000,
        user: refreshed.user || stored.user
      });
      await renderAdminDashboard("product");
    } else {
      clearSession();
      renderAdminLogin();
    }
  } catch(e) {
    console.error("Admin session refresh failed:",e);
    clearSession();
    renderAdminLogin();
  }
}
window.addEventListener("hashchange", boot);
boot();

/* Shared markup builder used by both the real landing page and the admin Preview. */
function csvList(v){return String(v||"").split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean)}
function escHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function parseJsonObj(v,fallback={}){if(v&&typeof v==='object')return v;try{return JSON.parse(v)}catch(e){return fallback}}
function getPackConfig(p){
  let c=parseJsonObj(p?.pack_config,null);
  if(c)return c;
  return {mode:p?.pack_mode||"choice",pieces:p?.pack_pieces||3,items:p?.pack_items||[]};
}
function getStandardPackConfig(p){
  const c=parseJsonObj(p?.pack_config,{});
  if(c&&c.standard) return c.standard;
  return {enabled:false,visible:false,pieces:3,title_ar:p?.pack_title_ar||"",title_fr:p?.pack_title_fr||"",description_ar:p?.pack_description_ar||"",description_fr:p?.pack_description_fr||"",price:p?.pack_price??null,old_price:p?.pack_old_price??null,images:p?.pack_images||[],items:p?.pack_items||[]};
}
function getCustomPackConfig(p){
  const c=parseJsonObj(p?.pack_config,{});
  if(c&&c.custom) return c.custom;
  return {enabled:false,visible:false,pieces:3,title_ar:"",title_fr:"",description_ar:"",description_fr:"",price:null,old_price:null,images:[]};
}

function initPackGallery(){
  const p=STATE.product;if(!p)return;
  ['standard','custom'].forEach(type=>{
    const c=type==='standard'?getStandardPackConfig(p):getCustomPackConfig(p),imgs=(c.images||[]).filter(Boolean);if(imgs.length<2)return;
    const img=document.getElementById(`${type}-pack-gallery-img`),dots=document.getElementById(`${type}-pack-dots`);let i=0;
    const go=n=>{i=(n+imgs.length)%imgs.length;if(img)img.src=imgs[i];if(dots)dots.textContent=`${i+1} / ${imgs.length} · ${STATE.lang==='ar'?'دير السحب باش تشوف باقي الصور':'Faites glisser pour voir les autres images'}`};
    document.getElementById(`${type}-pack-prev`)?.addEventListener('click',()=>go(i-1));document.getElementById(`${type}-pack-next`)?.addEventListener('click',()=>go(i+1));
    let sx=0;document.getElementById(`${type}-pack-gallery`)?.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.getElementById(`${type}-pack-gallery`)?.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>35)go(i+(dx<0?1:-1))},{passive:true});

function initPurchaseSelector(root){
  const radios=root.querySelectorAll('input[name="purchase-choice"]');if(!radios.length){STATE.purchaseType='product';return;}
  const productWrap=root.querySelector('#product-options-wrap'),stdWrap=root.querySelector('#pack-standard-wrap'),cusWrap=root.querySelector('#pack-custom-wrap'),varietyWrap=root.querySelector('#variety-choice-wrap');
  const varietyRadios=root.querySelectorAll('input[name="variety-choice"]');
  const update=()=>{
    const selected=root.querySelector('input[name="purchase-choice"]:checked')?.value||'product';
    root.querySelectorAll('#purchase-selector > .purchase-grid .purchase-option').forEach(x=>x.classList.toggle('selected',x.querySelector('input')?.checked));
    if(productWrap) productWrap.style.display=selected==='product'?'block':'none';
    if(varietyWrap) varietyWrap.style.display=selected==='variety'?'block':'none';
    const varietySelected=root.querySelector('input[name="variety-choice"]:checked')?.value||'';
    if(stdWrap) stdWrap.style.display=selected==='variety'&&varietySelected==='pack_standard'?'block':'none';
    if(cusWrap) cusWrap.style.display=selected==='variety'&&varietySelected==='pack_custom'?'block':'none';
    root.querySelectorAll('.variety-option').forEach(x=>x.classList.toggle('selected',x.querySelector('input')?.checked));
    STATE.purchaseType=selected==='product'?'product':(varietySelected||'variety');
  };
  radios.forEach(r=>r.addEventListener('change',update));
  varietyRadios.forEach(r=>r.addEventListener('change',update));
  update();
  root.querySelectorAll('#pack-custom-wrap .choice-grid').forEach(g=>g.querySelectorAll('.choice-btn').forEach(b=>b.onclick=()=>{g.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}));
}
function getCurrentCartItem(){
  const root=document,purchase=root.querySelector('input[name="purchase-choice"]:checked')?.value||'product',qty=LANDING_QTY,productOptions={size:selectedChoice(root,'product-sizes'),color:selectedChoice(root,'product-colors')};let packOptions=[];
  if(purchase==='pack_custom'){const c=getCustomPackConfig(STATE.product),n=Math.max(1,Number(c.pieces)||1);for(let i=0;i<n;i++){const sg=root.querySelector(`#pack-custom-wrap .pack-sizes[data-piece="${i}"] .selected`),cg=root.querySelector(`#pack-custom-wrap .pack-colors[data-piece="${i}"] .selected`);packOptions.push({piece:i+1,size:sg?.dataset.value||'',color:cg?.dataset.value||''})}}
  if(purchase==='pack_standard')packOptions=getStandardPackConfig(STATE.product).items||[];
  return {purchaseType:purchase,quantity:qty,productOptions,packOptions};
}
function initCart(root){const btn=root.querySelector('#cart-button');if(!btn)return;btn.onclick=()=>{STATE.cartItem=getCurrentCartItem();const count=root.querySelector('#cart-count');if(count)count.textContent='1';const msg=root.querySelector('#order-msg');if(msg)msg.innerHTML=`<div class="msg ok">${STATE.lang==='ar'?'تمت إضافة الاختيار للسلة ✅':'Ajouté au panier ✅'}`;}}

    const p = STATE.product;

      LANDING_QTY++; document.getElementById("qty-value").textContent = LANDING_QTY;
    };
    document.getElementById("submit-btn").onclick = onSubmitOrder;
    initProductVideo(document);
    initClothingOptions(document);

async function onSubmitOrder(){
  const t=T[STATE.lang],name=document.getElementById("f_name").value.trim(),phone=document.getElementById("f_phone").value.trim(),city=document.getElementById("f_city").value.trim(),address=document.getElementById("f_address").value.trim(),msgBox=document.getElementById("order-msg");
  if(!name||!phone){msgBox.innerHTML=`<div class="msg err">${t.required}</div>`;return;}
  const selected=document.querySelector('input[name="purchase-choice"]:checked')?.value||'product';
  STATE.purchaseType=selected;
  const item=getCurrentCartItem();
  if(!STATE.cartItem) STATE.cartItem=item;
  const productOptions=item.productOptions||{};
  if(selected==='product'&&STATE.product.product_type==='clothing'&&(!productOptions.size||!productOptions.color)){msgBox.innerHTML=`<div class="msg err">${STATE.lang==='ar'?'اختار المقاس واللون من فضلك':'Veuillez choisir la taille et la couleur'}</div>`;return;}
  if((selected==='pack_standard'||selected==='pack_custom') && !STATE.cartItem){msgBox.innerHTML=`<div class="msg err">${STATE.lang==='ar'?'اختار الـPack من فضلك':'Veuillez choisir le pack'}</div>`;return;}
  STATE.order={customer_name:name,phone,city,address,quantity:item.quantity,product_options:productOptions,pack_options:item.packOptions||[]};
  if(STATE.upsell) renderUpsellStep(); else await finalizeOrder(false,null);
}

function renderUpsellStep(){
  const t = T[STATE.lang];
  const up = STATE.upsell;
  const upTitle = STATE.lang==="ar" ? up.title_ar : up.title_fr;
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="wrap" style="padding-top:24px">
      <div class="upsell-box">
        <div class="up-title">${t.add_offer}</div>
        ${up.image_url ? `<img src="${up.image_url}" style="border-radius:10px; margin-bottom:10px;">` : ""}
        <div>${upTitle} — <strong>${up.price} ${t.currency}</strong></div>
        <div class="up-check">
          <input type="checkbox" id="up-check">
          <label for="up-check">${t.yes_add}</label>
        </div>
      </div>
      <div id="order-msg"></div>
      <button class="cta" id="finish-btn">${t.finish_order}</button>
    </div>
  `;
  document.getElementById("finish-btn").onclick = ()=>{
    const accepted = document.getElementById("up-check").checked;
    finalizeOrder(accepted, up.id);
  };
}

async function finalizeOrder(upsellAccepted, upsellId){
  const t = T[STATE.lang];
  const body = {
    product_id: STATE.product.id,
    customer_name: STATE.order.customer_name,
    phone: STATE.order.phone,
    address: STATE.order.address,
    city: STATE.order.city,
    quantity: STATE.order.quantity,
    pack_selected: STATE.purchaseType !== "product",
    pack_price: STATE.purchaseType === "pack_standard" ? (getStandardPackConfig(STATE.product).price||0) : STATE.purchaseType === "pack_custom" ? (getCustomPackConfig(STATE.product).price||0) : null,
    pack_title: STATE.purchaseType === "pack_standard" ? (STATE.lang === "ar" ? getStandardPackConfig(STATE.product).title_ar : getStandardPackConfig(STATE.product).title_fr) : STATE.purchaseType === "pack_custom" ? (STATE.lang === "ar" ? getCustomPackConfig(STATE.product).title_ar : getCustomPackConfig(STATE.product).title_fr) : null,
    pack_options: STATE.order.pack_options || [],
    product_options: STATE.order.product_options || {},
    upsell_accepted: upsellAccepted,
    upsell_id: upsellId
  };
  const msgBox = document.getElementById("order-msg");
  const finishBtn = document.getElementById("finish-btn") || document.getElementById("submit-btn");
  if(finishBtn) finishBtn.disabled = true;

  // Customer orders are inserted anonymously. We only need Supabase to confirm
  // the INSERT succeeded; requesting the inserted row back would unnecessarily
  // require SELECT visibility on the orders table.
  const res = await sbInsertPublicOrder(body);
  const insertedOk = res.ok && res.status >= 200 && res.status < 300;

  if(!insertedOk){
    console.error("Order insert failed:", res.status, res.data);
  }

  if(insertedOk){
    STATE.step = "success";
    renderLanding();
  } else {
    if(finishBtn) finishBtn.disabled = false;
    if(msgBox) msgBox.innerHTML = `<div class="msg err">${t.order_error}</div>`;
  }
}

let ADMIN_TAB = "product";

let pendingImages = [];
let pendingVideoUrl = "";
let pendingPackImages = [];

async function loadAdminData(){
  adminData = { settings:null, product:null, upsell:null, orders:[] };

  const safe = async (fn, fallback) => {
    try { return await fn(); }
    catch(e) { console.error("Admin data request failed:", e); return fallback; }
  };

  const [s,p,o] = await Promise.all([
    safe(()=>sbGet("settings","id=eq.1&select=*"), []),
    safe(()=>sbGet("products","select=*&order=created_at.asc&limit=1"), []),
    safe(()=>sbGetAuth("orders","select=*&order=created_at.desc&limit=100"), [])
  ]);

  adminData.settings = Array.isArray(s) ? (s[0] || null) : null;
  adminData.product = Array.isArray(p) ? (p[0] || null) : null;
  adminData.orders = Array.isArray(o) ? o : [];

  if(adminData.product){

/* Columns that exist on the settings table from day one. Anything else (font_style, primary_color, ...)
   only saves once the admin has run the ALTER TABLE statements for the Design tab (see project notes). */
const SAFE_SETTINGS_FIELDS = ["store_name","theme_id","bg_color","default_language","whatsapp_enabled","whatsapp_number","whatsapp_timing"];
async function saveSettingsSmart(body){
  let res = await sbUpdate("settings","id=eq.1", body);
  let success = res.ok && res.status>=200 && res.status<300 && Array.isArray(res.data) && res.data.length>0;
  if(success) return { success:true, fallback:false };
  const safeBody = {};
  SAFE_SETTINGS_FIELDS.forEach(k=>{ if(k in body) safeBody[k]=body[k]; });
  if(Object.keys(safeBody).length === Object.keys(body).length){
    return { success:false, fallback:false };
  }
  res = await sbUpdate("settings","id=eq.1", safeBody);
  success = res.ok && res.status>=200 && res.status<300 && Array.isArray(res.data) && res.data.length>0;
  return { success, fallback:true };
}

function renderPackImagesPreview(){
  const box=document.getElementById("pack-images-preview"); if(!box) return;
  box.innerHTML=pendingPackImages.map((url,idx)=>`<div class="img-thumb"><img src="${url}"><button type="button" class="rm-btn" data-pack-rm="${idx}">✕</button><div class="mv-btns">${idx>0?`<button type="button" data-pack-mv="${idx}:-1">◀</button>`:""}${idx<pendingPackImages.length-1?`<button type="button" data-pack-mv="${idx}:1">▶</button>`:""}</div></div>`).join("");
  box.querySelectorAll("[data-pack-rm]").forEach(b=>b.onclick=()=>{pendingPackImages.splice(+b.dataset.packRm,1);renderPackImagesPreview();});
  box.querySelectorAll("[data-pack-mv]").forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.packMv.split(":").map(Number),n=i+d;if(n<0||n>=pendingPackImages.length)return;[pendingPackImages[i],pendingPackImages[n]]=[pendingPackImages[n],pendingPackImages[i]];renderPackImagesPreview();});
}
async function onPackImagesSelected(e){
  const files=Array.from(e.target.files||[]); e.target.value=""; if(!files.length)return;
  const status=document.getElementById("pack-images-status");
  for(const file of files){
    if(!file.type.startsWith("image/"))continue;
    if(file.size>MAX_IMAGE_MB*1024*1024){status.textContent=`الصورة "${file.name}" كبيرة بزاف`;continue;}
    status.textContent=`جاري رفع ${file.name}...`;
    const res=await sbUploadFile(file,"images");
    if(res.ok){pendingPackImages.push(res.url);renderPackImagesPreview();status.textContent="";}else status.textContent=`فشل رفع "${file.name}"`;
  }
}
function renderImagesPreview(){
  const box = document.getElementById("images-preview");
  if(!box) return;
  box.innerHTML = pendingImages.map((url,idx)=>`
    <div class="img-thumb">
      <img src="${url}">
      <button type="button" class="rm-btn" data-idx="${idx}">✕</button>
      <div class="mv-btns">
        ${idx>0 ? `<button type="button" data-mv="${idx}:-1">◀</button>` : ""}
        ${idx<pendingImages.length-1 ? `<button type="button" data-mv="${idx}:1">▶</button>` : ""}
      </div>
    </div>
  `).join("");
  box.querySelectorAll(".rm-btn").forEach(b=>{
    b.onclick = ()=>{ pendingImages.splice(parseInt(b.dataset.idx,10),1); renderImagesPreview(); };
  });
  box.querySelectorAll("[data-mv]").forEach(b=>{
    b.onclick = ()=>{
      const parts = b.dataset.mv.split(":").map(Number);
      const idx = parts[0], dir = parts[1];
      const newIdx = idx+dir;
      if(newIdx<0 || newIdx>=pendingImages.length) return;
      const tmp = pendingImages[idx];
      pendingImages[idx] = pendingImages[newIdx];
      pendingImages[newIdx] = tmp;
      renderImagesPreview();
    };
  });
}

function renderVideoPreview(){
  const box = document.getElementById("video-preview");
  if(!box) return;
  box.innerHTML = pendingVideoUrl
    ? `<video src="${pendingVideoUrl}" controls playsinline style="width:100%; border-radius:10px; margin-top:8px;"></video>`
    : "";
}

async function onImagesSelected(e){
  const files = Array.from(e.target.files||[]);
  e.target.value = "";
  if(files.length===0) return;
  const status = document.getElementById("images-status");
  for(const file of files){
    if(!file.type.startsWith("image/")){
      status.innerHTML = `<span style="color:#B02A2A">الملف "${file.name}" ماشي صورة</span>`;
      continue;
    }
    if(file.size > MAX_IMAGE_MB*1024*1024){
      status.innerHTML = `<span style="color:#B02A2A">الصورة "${file.name}" كبيرة بزاف (الحد الأقصى ${MAX_IMAGE_MB}MB)</span>`;
      continue;
    }
    status.textContent = `جاري رفع ${file.name}...`;
    const res = await sbUploadFile(file, "images");
    if(res.ok){
      pendingImages.push(res.url);
      renderImagesPreview();
      status.textContent = "";
    } else {
      status.innerHTML = `<span style="color:#B02A2A">فشل رفع "${file.name}": ${res.error}</span>`;
    }
  }
}

async function onVideoSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const status = document.getElementById("video-status");
  if(!file.type.startsWith("video/")){
    status.innerHTML = `<span style="color:#B02A2A">الملف المختار ماشي فيديو</span>`;
    return;
  }
  if(file.size > MAX_VIDEO_MB*1024*1024){
    status.innerHTML = `<span style="color:#B02A2A">الفيديو كبير بزاف (الحد الأقصى ${MAX_VIDEO_MB}MB)</span>`;
    return;
  }
  status.textContent = "جاري رفع الفيديو...";
  const res = await sbUploadFile(file, "videos");
  if(res.ok){
    pendingVideoUrl = res.url;
    renderVideoPreview();
    document.getElementById("btn-remove-video").style.display = "inline-block";
    status.textContent = "تم الرفع ✅";
  } else {
    status.innerHTML = `<span style="color:#B02A2A">فشل رفع الفيديو: ${res.error}</span>`;
  }
}

function openChangePasswordModal(){
  const old = document.getElementById("change-pass-modal");
  if(old) old.remove();
  const overlay = document.createElement("div");
  overlay.id = "change-pass-modal";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <button type="button" class="close-x" id="cp-close">✕</button>
      <h2 class="section-title" style="margin-top:6px;">تغيير كلمة السر</h2>
      <div class="field"><label>كلمة السر القديمة</label><input id="cp_old" type="password"></div>
      <div class="field"><label>كلمة السر الجديدة</label><input id="cp_new" type="password"></div>
      <div class="field"><label>تأكيد كلمة السر الجديدة</label><input id="cp_confirm" type="password"></div>
      <div id="cp-msg"></div>
      <button class="cta" id="cp-save-btn" type="button">حفظ</button>
    </div>
  `;
  document.body.appendChild(overlay);
  translateAdminDom(overlay);
  document.getElementById("cp-close").onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.getElementById("cp-save-btn").onclick = async ()=>{
    const oldPass = document.getElementById("cp_old").value;
    const p1 = document.getElementById("cp_new").value;
    const p2 = document.getElementById("cp_confirm").value;
    const msg = document.getElementById("cp-msg");
    const email = session.user && session.user.email;
    if(!email){ msg.innerHTML = `<div class="msg err">وقع مشكل بالجلسة، عاود دخول من جديد</div>`; return; }
    if(!oldPass){ msg.innerHTML = `<div class="msg err">دخل كلمة السر القديمة</div>`; return; }
    if(!p1 || p1.length<6){ msg.innerHTML = `<div class="msg err">كلمة السر الجديدة خاصها 6 حروف/أرقام على الأقل</div>`; return; }
    if(p1 !== p2){ msg.innerHTML = `<div class="msg err">كلمتا السر الجديدة غير متطابقتين</div>`; return; }
    const btn = document.getElementById("cp-save-btn");
    btn.disabled = true;
    msg.innerHTML = `<div class="small-muted">جاري التحقق...</div>`;
    const verify = await sbLogin(email, oldPass);
    if(!verify.access_token){
      msg.innerHTML = `<div class="msg err">كلمة السر القديمة غير صحيحة</div>`;
      btn.disabled = false;
      return;
    }
    const res = await sbUpdateUserPassword(verify.access_token, p1);
    if(res.ok){
      msg.innerHTML = `<div class="msg ok">Password changed successfully ✅</div>`;
      saveSession({
        access_token: verify.access_token,
        refresh_token: verify.refresh_token,
        expires_at: Date.now() + (verify.expires_in||3600)*1000,
        user: verify.user
      });
      setTimeout(()=> overlay.remove(), 1400);
    } else {
      msg.innerHTML = `<div class="msg err">وقع مشكل، حاول مرة أخرى</div>`;
      btn.disabled = false;
    }
  };
}

/* ================= ADMIN: PREVIEW (no DB writes) ================= */
let PREVIEW_LANG = "ar";
let PREVIEW_APPROVED = false;
function setPreviewApproval(ok){
  PREVIEW_APPROVED=!!ok;
  document.getElementById("save-product")?.toggleAttribute("disabled", !PREVIEW_APPROVED);
  document.getElementById("save-pack")?.toggleAttribute("disabled", !PREVIEW_APPROVED);
}
function bindPreviewRequired(){
  const root=document.getElementById("tab-content"); if(!root)return;
  root.querySelectorAll("input, textarea, select").forEach(el=>{
    el.addEventListener("input",()=>setPreviewApproval(false));
    el.addEventListener("change",()=>setPreviewApproval(false));
  });
  setPreviewApproval(false);
}

function collectPreviewData(){
  const s=Object.assign({},adminData.settings||{},UNSAVED_DRAFT.settings||{});
  if(document.getElementById("s_bg")){
    s.bg_color=document.getElementById("s_bg").value; s.store_name=document.getElementById("s_store").value; s.default_language=document.getElementById("s_lang").value;
    s.whatsapp_enabled=document.getElementById("s_wa_enabled").checked; s.whatsapp_number=document.getElementById("s_wa_number").value; s.whatsapp_timing=document.getElementById("s_wa_timing").value; s.theme_id=SETTINGS_SELECTED_THEME||s.theme_id;
    UNSAVED_DRAFT.settings=Object.assign({},s);
  }
  if(document.getElementById("d_bg_style")){
    Object.assign(s, readDesignFields());
    UNSAVED_DRAFT.settings=Object.assign({},s);
  }
  const p=Object.assign({},adminData.product||{},UNSAVED_DRAFT.product||{});
  if(document.getElementById("p_title_ar")){
    p.title_ar=document.getElementById("p_title_ar").value; p.title_fr=document.getElementById("p_title_fr").value;
    p.description_ar=document.getElementById("p_desc_ar").value; p.description_fr=document.getElementById("p_desc_fr").value;
    p.product_type=getProductTypeFormValue();
    p.price=parseFloat(getProductFormValue("price"))||0;
    const oldP=getProductFormValue("old_price"); p.old_price=oldP?parseFloat(oldP):null;
    p.stock_quantity=Math.max(0,parseInt(getProductFormValue("stock")||"0",10));
    p.sizes=document.getElementById("p_sizes")?.value||""; p.colors=document.getElementById("p_colors")?.value||"";
    p.is_active=document.getElementById("p_active").checked;
    Object.assign(p, typeof collectPackBody==="function" ? collectPackBody() : {});
  }
  p.images=pendingImages.slice(); p.video_url=pendingVideoUrl||""; UNSAVED_DRAFT.product=Object.assign({},p);
  return {settings:s,product:p};
}

function openPreview(){
  const { settings, product } = collectPreviewData();
  PREVIEW_SNAPSHOT = {
    settings: JSON.parse(JSON.stringify(settings || {})),
    product: JSON.parse(JSON.stringify(product || {}))
  };
  PREVIEW_LANG = settings.default_language || "ar";
  renderPreviewOverlay(PREVIEW_SNAPSHOT.settings, PREVIEW_SNAPSHOT.product);
  setPreviewApproval(true);
}

function renderPreviewOverlay(settings, product){
  let overlay = document.getElementById("preview-overlay");
  if(!overlay){
    overlay = document.createElement("div");
    overlay.id = "preview-overlay";
    overlay.className = "preview-overlay";
    document.body.appendChild(overlay);
  }
  applyThemeAndContrast(settings);
  document.documentElement.dir = PREVIEW_LANG === "ar" ? "rtl" : "ltr";

  const hasProduct = product && (product.title_ar || product.title_fr);
  const t = T[PREVIEW_LANG] || T.ar;
  const bodyHtml = hasProduct
    ? buildFormMarkup(settings, product, PREVIEW_LANG, 1)
    : `<div class="wrap" style="padding-top:80px; text-align:center; color:var(--muted)">${t.no_product}</div>`;

  overlay.innerHTML = `
    <div class="preview-bar">
      <span class="tag">👁 معاينة (غير محفوظ)</span>
      <button type="button" id="close-preview">🔙 رجوع للتعديل</button>
    </div>
    ${bodyHtml}
  `;
  document.getElementById("close-preview").onclick = closePreview;

  if(hasProduct){
    initProductVideo(overlay);
    overlay.querySelectorAll("[data-lang]").forEach(b=>{
      b.onclick = ()=>{ PREVIEW_LANG = b.dataset.lang; renderPreviewOverlay(settings, product); };
    });
    let qty = 1;
    const qtyMinus = overlay.querySelector("#qty-minus");
    const qtyPlus = overlay.querySelector("#qty-plus");
    const qtyValue = overlay.querySelector("#qty-value");
    if(qtyMinus) qtyMinus.onclick = ()=>{ if(qty>1){ qty--; qtyValue.textContent = qty; } };
    if(qtyPlus) qtyPlus.onclick = ()=>{ qty++; qtyValue.textContent = qty; };
    const submitBtn = overlay.querySelector("#submit-btn");
    if(submitBtn) submitBtn.onclick = (e)=>{
      e.preventDefault();
      const msgBox = overlay.querySelector("#order-msg");
      if(msgBox) msgBox.innerHTML = `<div class="msg ok">هادي معاينة فقط، الطلب ما غاديش يتسجل فقاعدة البيانات</div>`;
    };
  }
}

function closePreview(){
  const overlay = document.getElementById("preview-overlay");
  if(overlay) overlay.remove();
  resetAdminChrome();
  document.documentElement.dir = "rtl";
}
</script>
